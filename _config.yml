remote_theme: "mmistakes/minimal-mistakes@4.28.0"
minimal_mistakes_skin: "default"

locale: "ko-KR"
title: "aJISUa Tech Blog"
title_separator: "·"
name: "최지수"
description: "수업, 동아리, 프로젝트에서 배우고 만든 것들을 정리하는 블로그"
url: "https://ajisua.github.io"
baseurl: "/tech-blog"
repository: "aJISUa/tech-blog"
timezone: "Asia/Seoul"
date_format: "%Y.%m.%d"

author:
  name: "최지수"
  bio: "이화여자대학교 컴퓨터공학전공"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/aJISUa"

search: true
search_full_content: true
search_provider: lunr
lunr:
  search_within_pages: true

permalink: /:categories/:title/
paginate: 10
paginate_path: /page:num/
words_per_minute: 200
enable_copy_code_button: true

plugins:
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

include:
  - _pages

exclude:
  - README.md
  - templates
  - vendor
  - Gemfile
  - Gemfile.lock

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: false
      show_date: true
      share: false
      related: true
      toc: true
      toc_sticky: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/aJISUa"

copyright: "최지수"
copyright_url: "https://github.com/aJISUa"

analytics:
  provider: false
