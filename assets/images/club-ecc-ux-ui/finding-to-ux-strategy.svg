  <text class="cap" x="24" y="358" text-anchor="start">페인포인트는 현재의 사용자 경험에 대한 상향식 리서치에서, 기회 요인은 시스템과 기술에 대한 하향식 조망에서</text>
  <text class="cap" x="24" y="376" text-anchor="start">나올 가능성이 높다. UX 전략의 상당수는 페인포인트에서, 일부는 기회 요인에서 도출된다.</text>
