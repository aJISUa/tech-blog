  <text class="t12" x="122" y="71" text-anchor="middle">애플리케이션을 이용해</text>
  <text class="t12" x="122" y="87" text-anchor="middle">숙련도가 높은</text>
  <text class="t12" x="638" y="71" text-anchor="middle">애플리케이션을 이용해</text>
  <text class="t12" x="638" y="87" text-anchor="middle">숙련도가 낮은</text>
