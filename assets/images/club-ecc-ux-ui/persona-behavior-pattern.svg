  <text class="t12" x="122" y="131" text-anchor="middle">서비스에서 요청하는 정보의</text>
  <text class="t12" x="122" y="147" text-anchor="middle">양이 많아도 개의치 않는</text>
  <text class="t12" x="638" y="131" text-anchor="middle">서비스에서 요청하는 정보의</text>
  <text class="t12" x="638" y="147" text-anchor="middle">양이 많아 불편한</text>
