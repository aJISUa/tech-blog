  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <text class="b" x="374" y="28" text-anchor="end">행동 패턴 매핑</text>
  <text class="sm" x="382" y="28" text-anchor="start" font-size="12">Behavior Pattern Mapping</text>
  <rect class="sft" x="24" y="52" width="196" height="44" rx="5"/>
