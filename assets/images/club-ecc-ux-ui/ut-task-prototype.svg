<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" role="img">
  <title>태스크와 프로토타입의 관계</title>
  <style>
    text { font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .h   { font-size: 14px; fill: #222; font-weight: 600; }
    .ha  { font-size: 14px; fill: #2b5797; font-weight: 700; }
    .t   { font-size: 13px; fill: #3a3a3a; }
    .ta  { font-size: 13px; fill: #2b5797; font-weight: 600; }
    .sm  { font-size: 12px; fill: #8a8a8a; }
    .box { fill: #ffffff; stroke: #d8d8d8; stroke-width: 1; }
    .soft{ fill: #f7f7f5; stroke: #d8d8d8; stroke-width: 1; }
    .bxa { fill: #eef3fb; stroke: #2b5797; stroke-width: 1.5; }
    .dsh { fill: none; stroke: #b8b8b8; stroke-width: 1; stroke-dasharray: 4 3; }
    .ln  { stroke: #b8b8b8; stroke-width: 1.2; fill: none; }
    .lna { stroke: #2b5797; stroke-width: 2; fill: none; }
    .ax  { stroke: #8a8a8a; stroke-width: 1.2; fill: none; }
  </style>
  <rect x="0" y="0" width="700" height="400" fill="#ffffff"/>
  <path class="ax" d="M50 200 L650 200 M350 50 L350 350"/>
  <text class="h" x="350" y="40" text-anchor="middle">High-Fidelity</text>
  <text class="h" x="350" y="372" text-anchor="middle">Low-Fidelity</text>
  <text class="h" x="50" y="222">모호한 태스크</text>
  <text class="h" x="650" y="222" text-anchor="end">구체적인 태스크</text>
  <rect class="bxa" x="364" y="90" width="270" height="62" rx="6"/>
  <text class="ta" x="499" y="116" text-anchor="middle">제한된 범위에서 완벽히 작동하는 프로토타입</text>
  <text class="sm" x="499" y="136" text-anchor="middle">수직적 프로토타입이기 쉽다</text>
  <rect class="box" x="66" y="90" width="270" height="62" rx="6"/>
  <text class="t" x="201" y="116" text-anchor="middle">기존 제품을 사용하여 테스트</text>
  <text class="sm" x="201" y="136" text-anchor="middle">기성 제품은 포괄적 태스크에도 대응한다</text>
  <rect class="box" x="66" y="244" width="270" height="62" rx="6"/>
  <text class="t" x="201" y="270" text-anchor="middle">페이퍼 프로토타입</text>
  <text class="sm" x="201" y="290" text-anchor="middle">수평적 프로토타입이기 쉽다</text>
  <rect class="dsh" x="364" y="244" width="270" height="62" rx="6"/>
  <text class="sm" x="499" y="270" text-anchor="middle">사례 없음</text>
  <text class="sm" x="499" y="290" text-anchor="middle">LF로는 구체적인 태스크를 수행할 수 없다</text>
</svg>
