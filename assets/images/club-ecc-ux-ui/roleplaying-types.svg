  <text font-size="13" fill="#2b5797" font-weight="600" x="625.0" y="74" text-anchor="middle">모형과 소품으로</text>
  <text font-size="13" fill="#2b5797" font-weight="600" x="625.0" y="92" text-anchor="middle">재연하는 롤플레잉</text>
  <rect x="535" y="106" width="180" height="26" rx="13" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text font-size="12" fill="#3a3a3a" x="625.0" y="123" text-anchor="middle">데스크톱 워크스루와 유사</text>
  <text font-size="11" fill="#8a8a8a" x="528" y="156" text-anchor="start">교재 사진의 예</text>
  <circle cx="532" cy="172" r="2" fill="#8a8a8a"/>
  <text font-size="12" fill="#3a3a3a" x="541" y="176" text-anchor="start">모형 · 소품으로 3차원에서</text>
  <text font-size="12" fill="#3a3a3a" x="541" y="194" text-anchor="start">표현하는 롤플레잉</text>
  <circle cx="532" cy="208" r="2" fill="#8a8a8a"/>
  <text font-size="12" fill="#3a3a3a" x="541" y="212" text-anchor="start">LEGO Serious Play</text>
  <line x1="528" y1="246" x2="722" y2="246" stroke="#ececec" stroke-width="1"/>
  <text font-size="11" fill="#8a8a8a" x="625.0" y="268" text-anchor="middle">평면도를 내려다보며 전체를 조망</text>
  <text font-size="11" fill="#8a8a8a" x="625.0" y="286" text-anchor="middle">물리적 감각 · 소요 시간에는 부적합</text>
