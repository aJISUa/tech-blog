  <line stroke="#b8b8b8" stroke-width="1" stroke-dasharray="4 3" fill="none" x1="502.5" y1="14" x2="502.5" y2="318"/>
  <rect fill="#ffffff" stroke="#d8d8d8" stroke-width="1" x="20" y="48" width="230" height="262" rx="5"/>
