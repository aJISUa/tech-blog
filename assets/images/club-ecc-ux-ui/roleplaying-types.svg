<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img">
  <title>롤플레잉의 분류</title>
  <style>
    text { font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  </style>
  <rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
  <text font-size="11" fill="#8a8a8a" x="250" y="24" text-anchor="middle">1인칭 시점 · 실물 스케일</text>
  <path stroke="#b8b8b8" stroke-width="1.2" fill="none" d="M20 40 L20 33 L495 33 L495 40"/>
