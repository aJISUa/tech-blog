  <text font-size="12" fill="#3a3a3a" x="296" y="212" text-anchor="start">연기하는 롤플레잉</text>
  <line x1="283" y1="246" x2="477" y2="246" stroke="#ececec" stroke-width="1"/>
  <text font-size="11" fill="#8a8a8a" x="380.0" y="268" text-anchor="middle">실제의 물리적 · 공간적 감각과</text>
