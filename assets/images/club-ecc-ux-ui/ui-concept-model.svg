<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="720" height="390" role="img">
  <title>인터페이스 유형과 관계</title>
  <style>
    text { font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .h   { font-size: 14px; fill: #222; font-weight: 600; }
    .ha  { font-size: 14px; fill: #2b5797; font-weight: 700; }
    .t   { font-size: 13px; fill: #3a3a3a; }
    .ta  { font-size: 13px; fill: #2b5797; font-weight: 600; }
    .sm  { font-size: 12px; fill: #8a8a8a; }
    .box { fill: #ffffff; stroke: #d8d8d8; stroke-width: 1; }
    .soft{ fill: #f7f7f5; stroke: #d8d8d8; stroke-width: 1; }
    .bxa { fill: #eef3fb; stroke: #2b5797; stroke-width: 1.5; }
    .dsh { fill: none; stroke: #b8b8b8; stroke-width: 1; stroke-dasharray: 4 3; }
    .ln  { stroke: #b8b8b8; stroke-width: 1.2; fill: none; }
    .lna { stroke: #2b5797; stroke-width: 2; fill: none; }
    .ax  { stroke: #8a8a8a; stroke-width: 1.2; fill: none; }
  </style>
  <rect x="0" y="0" width="720" height="390" fill="#ffffff"/>
  <path class="ln" d="M300 50 L150 150 L300 330 L450 150 Z M150 150 L450 150 M300 50 L300 330"/>
  <path class="dsh" d="M30 215 L640 215"/>
  <text class="sm" x="30" y="207">표층</text>
  <text class="sm" x="30" y="232">심층</text>
  <rect class="bxa" x="270" y="16" width="60" height="30" rx="5"/>
  <text class="ha" x="300.0" y="36.0" text-anchor="middle">AUI</text>
  <rect class="bxa" x="90" y="135" width="60" height="30" rx="5"/>
  <text class="ha" x="120.0" y="155.0" text-anchor="middle">PUI</text>
  <rect class="bxa" x="450" y="135" width="60" height="30" rx="5"/>
  <text class="ha" x="480.0" y="155.0" text-anchor="middle">GUI</text>
  <rect class="bxa" x="270" y="334" width="60" height="30" rx="5"/>
  <text class="ha" x="300.0" y="354.0" text-anchor="middle">UI</text>
  <text class="h" x="340" y="28">청각적 사용자 인터페이스</text>
  <text class="sm" x="340" y="45">사운드/보이스, 대화형 UI, 채팅</text>
  <text class="h" x="20" y="100">물리적 사용자 인터페이스</text>
  <text class="sm" x="20" y="117">폼팩터, 어포던스, 인간공학, 사이즈</text>
  <text class="sm" x="96" y="186" text-anchor="middle">전통 제품 디자인</text>
  <text class="h" x="470" y="100">그래픽 사용자 인터페이스</text>
  <text class="sm" x="470" y="117">아이덴티티, 룩&amp;필, 메타포, 아이콘</text>
  <text class="sm" x="530" y="186" text-anchor="middle">인포메이션 콘텐츠 디자인</text>
  <text class="h" x="256" y="350" text-anchor="end">사용자 인터페이스</text>
  <text class="sm" x="256" y="367" text-anchor="end">정보 구조, 워크플로</text>
  <rect class="soft" x="430" y="250" width="124" height="30" rx="5"/>
  <text class="t" x="492.0" y="270.0" text-anchor="middle">디자인 시스템</text>
  <text class="sm" x="562" y="270">컴포넌트, UI 요소</text>
  <rect class="soft" x="430" y="290" width="124" height="30" rx="5"/>
  <text class="t" x="492.0" y="310.0" text-anchor="middle">디자인 가이드라인</text>
  <text class="sm" x="562" y="310">워크플로, 내비게이션 룰</text>
  <path class="dsh" d="M480 165 L490 250 M332 340 L430 305"/>
</svg>
